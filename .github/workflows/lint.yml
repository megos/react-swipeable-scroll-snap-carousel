name: lint
on:
  - pull_request
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
    - run: corepack enable
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - run: yarn --immutable
    - run: yarn lint:ci
